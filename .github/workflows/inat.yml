name: Photos et cartes iNaturalist
on:
  push:
    branches: [sk-build]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python tools/build_inat.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/medias.json data/inat.json
          git diff --cached --quiet || git commit -m "Mise à jour des photos et cartes iNaturalist"
          git push
